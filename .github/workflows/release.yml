name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # A tag that does not match the package version would publish a mislabelled wheel.
      - run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv build
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
