<title id="ragkit-layout-title">ragkit code layout</title>
<desc id="ragkit-layout-desc">cli.py drives experiment harnesses, model-backed modules and the numpy-only core library, each layer importing only the layers below it; eurlex.py writes the data directory.</desc>
<defs>
      <style>#ragkit-layout-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #ragkit-layout-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ragkit-layout-root .diagram-container { overflow-x: visible; }
}</style>
