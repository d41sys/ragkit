<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ragkit-ezcross-title ragkit-ezcross-desc" id="ragkit-ezcross-root">
<title id="ragkit-ezcross-title">ragkit inside the ezcross-ems agent</title>
<desc id="ragkit-ezcross-desc">A signed-in user talks to the ezc-server agent session, whose search_eu_law tool calls a JWT-protected FastAPI endpoint that runs ragkit.search; the agent answers with citations and logs every tool call.</desc>
<defs>
      <style>#ragkit-ezcross-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #ragkit-ezcross-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ragkit-ezcross-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="ragkit-ezcross-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
<marker id="ragkit-ezcross-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
<marker id="ragkit-ezcross-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
