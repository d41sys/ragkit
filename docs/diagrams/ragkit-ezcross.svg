="100" width="200" height="72" rx="6" fill="#ffffff"/><rect x="40" y="100" width="200" height="72" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="140" y="140" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">user</text><rect x="380" y="100" width="200" height="72" rx="6" fill="#ffffff"/><rect x="380" y="100" width="200" height="72" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="480" y="128" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">ezc-server agent session</text><text x="480" y="144" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">agent's own model</text><text x="480" y="156" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">writes the answer</text><rect x="720" y="100" width="200" height="72" rx="6" fill="#ffffff"/><rect x="720" y="100" width="200" height="72" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="820" y="134" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">EzcTool search_eu_law</text><text x="820" y="150" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">read-only</text><rect x="720" y="240" width="200" height="72" rx="6" fill="#ffffff"/><rect x="720" y="240" width="200" height="72" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="820" y="274" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">FastAPI endpoint</text><text x="820" y="290" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">get_current_user</text><rect x="380" y="240" width="200" height="72" rx="6" fill="#ffffff"/><rect x="380" y="240" width="200" height="72" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="480" y="268" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">ragkit.search()</text><text x="480" y="284" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">articles, ids,</text><text x="480" y="296" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">EUR-Lex URLs (#1)</text><rect x="40" y="240" width="200" height="72" rx="6" fill="#ffffff"/><rect x="40" y="240" width="200" height="72" rx="6" fill="#1f2328" stroke="#59636e" stroke-width="1" fill-opacity="0.05"/><text x="140" y="268" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">agent_session_entries</text><text x="140" y="284" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">every tool call</text><text x="140" y="296" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">and result</text><line x1="40" y1="340" x2="920" y2="340" stroke="#1f2328" stroke-width="0.8" stroke-opacity="0.10"/><text x="40" y="360" fill="#59636e" font-size="8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.14em">LEGEND</text><rect x="120" y="352" width="24" height="12" rx="2" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="152" y="360" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">user, service or tool</text><rect x="320" y="352" width="24" height="12" rx="2" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="352" y="360" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">ragkit</text><rect x="520" y="352" width="24" height="12" rx="2" fill="#1f2328" stroke="#59636e" stroke-width="1" fill-opacity="0.05"/><text x="552" y="360" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">session log table</text><line x1="720" y1="357" x2="744" y2="357" stroke="#59636e" stroke-width="1" stroke-dasharray="4,3"/><text x="752" y="360" fill="#59636e" font-size="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">audit log write</text>
</svg>
