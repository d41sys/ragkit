<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 824" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ragkit-flow-title ragkit-flow-desc" id="ragkit-flow-root">
<title id="ragkit-flow-title">ragkit request flow</title>
<desc id="ragkit-flow-desc">A chunked Markdown corpus and the question go to either the offline numpy retrievers or the neural st-extra retrievers, whose reranked results feed ragkit ask (support threshold 0.5, extractive answer or abstain) or ragkit answer (pack parent articles into 12k tokens, gate, then Claude through CachedMessages).</desc>
<defs>
      <style>#ragkit-flow-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #ragkit-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ragkit-flow-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="ragkit-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59636e"/></marker>
<marker id="ragkit-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
<marker id="ragkit-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0969da"/></marker>
</defs>
