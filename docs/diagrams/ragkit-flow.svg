FMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">whole parent articles;</text><text x="390" y="594" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">top 10 chunks → 12k tokens</text><text x="390" y="606" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">--no-pack: 3 articles</text><rect x="300" y="668" width="180" height="68" rx="6" fill="#ffffff"/><rect x="300" y="668" width="180" height="68" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="390" y="700" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">gate</text><text x="390" y="716" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">none (default) / suff / self</text><rect x="516" y="668" width="220" height="68" rx="6" fill="#ffffff"/><rect x="516" y="668" width="220" height="68" rx="6" fill="#0969da" stroke="#0969da" stroke-width="1" fill-opacity="0.08"/><text x="626" y="694" fill="#1f2328" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">Claude</text><text x="626" y="710" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">through CachedMessages</text><text x="626" y="722" fill="#59636e" font-size="9" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">JSONL call cache</text><rect x="772" y="668" width="148" height="68" rx="6" fill="#ffffff"/><rect x="772" y="668" width="148" height="68" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="1"/><text x="8