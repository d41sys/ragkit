[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragkit"
version = "0.2.0"
description = "Modular RAG pipeline from scratch with hybrid search, lexical reranking, and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
llm = ["anthropic>=0.30"]

[project.scripts]
ragkit = "ragkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["slow: trains models / downloads data", "network: needs internet"]
addopts = "-m 'not slow and not network'"
